name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      unlocked:
        description: "Include OPENSOURCE_UNLOCKED (all Pro features)"
        type: boolean
        default: true
  push:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    env:
      XCODE_VER: "26.0.1"
      EXTRA_COND: ${{ inputs.unlocked == false && '' || 'OPENSOURCE_UNLOCKED' }}
      SOLVER_FLAGS: "-Xfrontend -solver-expression-time-threshold=3600000 -Xfrontend -solver-scope-threshold=500000"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VER }}
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VER}.app"
          xcodebuild -version

      - name: Ensure watchOS platform runtime
        run: |
          for i in 1 2 3; do
            xcodebuild -downloadPlatform watchOS && break
            echo "retry $i"; sleep 10
          done
          xcrun simctl runtime list || true

      - name: Resolve Swift packages
        working-directory: apps/ios/Orange Cloud
        run: |
          xcodebuild -project "Orange Cloud.xcodeproj" -scheme "Orange Cloud" \
            -resolvePackageDependencies -derivedDataPath "$RUNNER_TEMP/dd"

      - name: Build unsigned archive
        working-directory: apps/ios/Orange Cloud
        run: |
          set -o pipefail
          xcodebuild -project "Orange Cloud.xcodeproj" -scheme "Orange Cloud" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/OrangeCloud.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_COMPILATION_MODE=singlefile \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$EXTRA_COND" \
            OTHER_SWIFT_FLAGS="$SOLVER_FLAGS" \
            archive

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/OrangeCloud.xcarchive/Products/Applications/Orange Cloud.app"
          ls -d "$RUNNER_TEMP/OrangeCloud.xcarchive/Products/Applications/"*
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -qry OrangeCloud-unsigned.ipa Payload
          ls -lh OrangeCloud-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OrangeCloud-unsigned-ipa
          path: ${{ runner.temp }}/OrangeCloud-unsigned.ipa
          retention-days: 14
